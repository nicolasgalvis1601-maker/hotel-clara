name: Deploy GitHub Pages

# Opcional: la app completa se despliega en Render. Este workflow solo publica una
# copia del frontend en GitHub Pages y se ejecuta a mano (Actions → Run workflow),
# para que no falle en cada push si Pages no está activado en el repositorio.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
